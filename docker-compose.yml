# INSIGHT backend stack (ARCHITECTURE.md §23)
# Host ports: backend 9056->8000, postgres 55432->5432, redis 56379->6379.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insight-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "9056:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - insight-net
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: insight-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insight}
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - insight-net

  redis:
    image: redis:7-alpine
    container_name: insight-redis
    command: redis-server --appendonly yes
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - insight-net

  # worker (Phase 2, reserved slot — not implemented in Phase 1)
  # worker:
  #   build: .
  #   command: celery -A app.workers.celery_app worker
  #   env_file: [.env]
  #   networks: [insight-net]

volumes:
  pg_data:
  redis_data:

networks:
  insight-net:
    driver: bridge
